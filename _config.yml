url: "https://charliemchapman.com"
paginate: 5
paginate_path: "/:num/"

title: "Charlie Chapman"
description: "The personal blog of Charlie Chapman."

logo: /assets/images/charlie-profile-x.jpg

twitter:
  username: _chuckyc
  card: summary

social:
  name: Charlie Chapman
  links:
    - https://twitter.com/_chuckyc

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      permalink: /posts/:year/:i_month/:i_day/:title/
  - scope:
      path: ""
      type: "appearances"
    values:
      layout: "post"
      permalink: /appearances/:year/:i_month/:i_day/:title/
      content_type: "appearance"
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "post"
      permalink: /talks/:year/:i_month/:i_day/:title/
      content_type: "talk"
  - scope:
      path: "pages"
    values:
      permalink: /:basename:output_ext
  - scope:
      path: ""
    values:
      layout: "default"
      image: /assets/images/charlie-profile-x.jpg

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  appearances:
    output: true
  talks:
    output: true
